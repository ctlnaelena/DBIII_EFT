server:
  port: 8080

spring:
  application:
    name: batch-service
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  datasource:
    url: jdbc:h2:file:./data/batch-service;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always

bancoxyz:
  batch:
    data-dir: ./data

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:h2:file:/data/batch-service;AUTO_SERVER=TRUE
bancoxyz:
  batch:
    data-dir: /legacy-data
