# Orquesta todo el ecosistema de microservicios de Banco XYZ (EFT S9):
#   - config-server / eureka-server: infraestructura Spring Cloud
#   - auth-server: Authorization Server OAuth2.0
#   - kafka: mensajeria asincrona (modo KRaft, sin Zookeeper)
#   - clientes-service / cuentas-service / pagos-service: microservicios
#     de dominio, preparados para escalabilidad horizontal (sin puerto
#     fijo publicado: se descubren via Eureka y se pueden escalar con
#     "docker compose up -d --scale cuentas-service=3")
#   - bff-web / bff-mobile / bff-atm: un Backend for Frontend por canal
#   - batch-service: los 3 Jobs de Spring Batch, disparables via REST
#
# Todos los servicios Spring Boot se levantan con SPRING_PROFILES_ACTIVE=docker.

services:

  kafka:
    image: apache/kafka:3.7.0
    container_name: bancoxyz-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    networks: [bancoxyz-net]

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: bancoxyz-config-server
    ports: ["8888:8888"]
    environment: [SPRING_PROFILES_ACTIVE=docker]
    networks: [bancoxyz-net]

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: bancoxyz-eureka-server
    ports: ["8761:8761"]
    environment: [SPRING_PROFILES_ACTIVE=docker]
    networks: [bancoxyz-net]

  auth-server:
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    container_name: bancoxyz-auth-server
    ports: ["9999:9999"]
    environment: [SPRING_PROFILES_ACTIVE=docker]
    networks: [bancoxyz-net]

  clientes-service:
    build:
      context: .
      dockerfile: clientes-service/Dockerfile
    environment: [SPRING_PROFILES_ACTIVE=docker]
    depends_on: [auth-server, eureka-server, config-server]
    expose: ["8083"]
    volumes: [clientes-data:/data]
    networks: [bancoxyz-net]

  cuentas-service:
    build:
      context: .
      dockerfile: cuentas-service/Dockerfile
    environment: [SPRING_PROFILES_ACTIVE=docker]
    depends_on: [auth-server, eureka-server, config-server, kafka, clientes-service]
    expose: ["8081"]
    volumes: [cuentas-data:/data]
    networks: [bancoxyz-net]

  pagos-service:
    build:
      context: .
      dockerfile: pagos-service/Dockerfile
    environment: [SPRING_PROFILES_ACTIVE=docker]
    depends_on: [auth-server, eureka-server, config-server, kafka, cuentas-service]
    expose: ["8082"]
    volumes: [pagos-data:/data]
    networks: [bancoxyz-net]

  bff-web:
    build:
      context: .
      dockerfile: bff-web/Dockerfile
    container_name: bancoxyz-bff-web
    ports: ["8091:8091"]
    environment: [SPRING_PROFILES_ACTIVE=docker]
    depends_on: [auth-server, eureka-server, clientes-service, cuentas-service, pagos-service]
    networks: [bancoxyz-net]

  bff-mobile:
    build:
      context: .
      dockerfile: bff-mobile/Dockerfile
    container_name: bancoxyz-bff-mobile
    ports: ["8092:8092"]
    environment: [SPRING_PROFILES_ACTIVE=docker]
    depends_on: [auth-server, eureka-server, clientes-service, cuentas-service, pagos-service]
    networks: [bancoxyz-net]

  bff-atm:
    build:
      context: .
      dockerfile: bff-atm/Dockerfile
    container_name: bancoxyz-bff-atm
    ports: ["8093:8093"]
    environment: [SPRING_PROFILES_ACTIVE=docker]
    depends_on: [auth-server, eureka-server, cuentas-service, pagos-service]
    networks: [bancoxyz-net]

  batch-service:
    build:
      context: .
      dockerfile: batch-service/Dockerfile
    container_name: bancoxyz-batch-service
    ports: ["8080:8080"]
    environment: [SPRING_PROFILES_ACTIVE=docker]
    volumes:
      - ./data:/legacy-data:ro
      - batch-data:/data
    networks: [bancoxyz-net]

networks:
  bancoxyz-net:
    driver: bridge

volumes:
  clientes-data:
  cuentas-data:
  pagos-data:
  batch-data:
