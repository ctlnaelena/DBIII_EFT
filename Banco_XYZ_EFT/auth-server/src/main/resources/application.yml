server:
  port: 9999

spring:
  application:
    name: auth-server

bancoxyz:
  auth:
    issuer: http://localhost:9999

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: docker
bancoxyz:
  auth:
    issuer: http://auth-server:9999
