server:
  port: 8083

spring:
  application:
    name: clientes-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:h2:file:./data/clientes-service;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/oauth2/jwks

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:h2:file:/data/clientes-service;AUTO_SERVER=TRUE
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-server:9999/oauth2/jwks
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
