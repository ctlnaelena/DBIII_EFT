server:
  port: 8091

spring:
  application:
    name: bff-web
  config:
    import: "optional:configserver:http://localhost:8888"

bancoxyz:
  auth:
    token-uri: http://localhost:9999/oauth2/token
    client-id: bff-web
    client-secret: bffweb-secret
    scope: "cuentas.read cuentas.write pagos.read pagos.write clientes.read clientes.write"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: docker
bancoxyz:
  auth:
    token-uri: http://auth-server:9999/oauth2/token
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
